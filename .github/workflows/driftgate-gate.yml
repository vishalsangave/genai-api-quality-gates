name: DriftGate Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly evaluation at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request_target:
    types: [labeled]

jobs:
  pr-gate:
    if: github.event_name != 'schedule' && github.event.label != 'run-evals'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync Python environment
        run: uv sync --extra dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install stateful mock dependencies
        run: npm install --prefix examples/express_mock

      - name: Start stateful order/export mock
        run: |
          PORT=3000 node examples/express_mock/server.js > /tmp/express.log 2>&1 &
          echo $! > /tmp/express.pid
          for attempt in $(seq 1 50); do
            if curl -sf http://127.0.0.1:3000/healthz > /dev/null; then
              echo "order/export mock ready"; break
            fi
            sleep 0.2
          done
          curl -sf http://127.0.0.1:3000/healthz > /dev/null || { cat /tmp/express.log; exit 1; }

      - name: Run zero-cost structural gate (no nightly)
        # judge.provider stays deterministic (pinned in the committed config);
        # no judge API key exists in this job, and no code path reaches an LLM.
        env:
          DRIFT_GATE_JUDGE_API_KEY: ""
        run: uv run pytest -m "not nightly" --timeout=180 -v

      - name: Upload PR gate test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-test-results
          path: |
            .driftgate/
            cassettes/
          retention-days: 90
          if-no-files-found: ignore

      - name: Stop stateful mock
        if: always()
        run: |
          kill $(cat /tmp/express.pid) 2>/dev/null || true

  nightly-eval:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.label == 'run-evals'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync Python environment
        run: uv sync --extra dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install stateful mock dependencies
        run: npm install --prefix examples/express_mock

      - name: Start stateful order/export mock
        run: |
          PORT=3000 node examples/express_mock/server.js > /tmp/express.log 2>&1 &
          echo $! > /tmp/express.pid
          for attempt in $(seq 1 50); do
            if curl -sf http://127.0.0.1:3000/healthz > /dev/null; then
              echo "order/export mock ready"; break
            fi
            sleep 0.2
          done
          curl -sf http://127.0.0.1:3000/healthz > /dev/null || { cat /tmp/express.log; exit 1; }

      - name: Download previous night's governor history
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: driftgate-history
          path: .driftgate/

      - name: Run Layer 3 metamorphic + statistical evaluation
        # A real LLM judge only activates when explicitly configured AND the
        # key secret exists; the committed default remains deterministic.
        run: uv run pytest -m nightly --timeout=1800 -v || true

      - name: Release-gate decision (PROMOTE=0 / ROLLBACK=1 / HOLD=2)
        id: gate
        run: |
          set +e
          uv run driftgate gate --metrics .driftgate/metrics.json --history .driftgate/history.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Exit 2 is overloaded: HOLD (a real decision) AND a CLI usage error
          # (e.g. --metrics file missing). A missing metrics file means the
          # nightly suite produced nothing governable — report as HOLD-like
          # and do not fail the nightly, but make the cause visible.
          if [ ! -f .driftgate/metrics.json ]; then
            echo "No .driftgate/metrics.json was produced by the nightly run; treating as HOLD (no statistical evidence)." >> "$GITHUB_STEP_SUMMARY"
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A real HOLD (2) is reported but must not fail the nightly; a ROLLBACK (1) does.
          test "$code" -eq 2 && exit 0
          exit "$code"

      - name: Publish decision to job summary
        if: always()
        run: |
          echo "DriftGate nightly decision exit code: ${{ steps.gate.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload governor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftgate-history
          path: .driftgate/
          retention-days: 90
          if-no-files-found: ignore

      - name: Stop stateful mock
        if: always()
        run: |
          kill $(cat /tmp/express.pid) 2>/dev/null || true
